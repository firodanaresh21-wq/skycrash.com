<style>
/* Layout: single phone-width app column, centered on wide screens; screens swap inside #view, bottom nav on main tabs. Dark arcade look by design. */
:root{
  --bg:#0a0610; --panel:#160f20; --panel2:#1f1530; --line:#33224d;
  --fg:#f6f1ff; --muted:#a393c2;
  --accent:#ff2d4a; --accent2:#ff7a3d;
  --good:#1fd655; --gold:#ffc93c; --violet:#7b3cff; --warn:#ff9f1c;

  color-scheme:dark;
}
:root[data-accent="blue"]{--accent:#2f8cff;--accent2:#35d0ff}
:root[data-accent="green"]{--accent:#12c47a;--accent2:#b6f04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;margin:0;

button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;min-width:0}
#view{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.rs{font-weight:700;color:var(--gold);margin-right:.12em}
.cg{margin-right:.2em;font-style:normal}
.logo{font-family:var(--display);color:var(--accent);letter-spacing:.02em;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent);display:inline-flex;align-items:center;gap:6px;line-height:1}
.logo b{color:#fff;font-weight:400}
.top{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.top .logo{font-size:22px;flex:1;min-width:0}
.top .title{flex:1;text-align:center;font-weight:600;font-size:16px;margin-right:36px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px;flex:none}
.bal{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.bal button{width:26px;height:26px;border-radius:50%;border:0;background:var(--good);color:#04230f;font-weight:700;font-size:18px;line-height:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.green{background:linear-gradient(#2be866,#14b840);color:#03210d;box-shadow:0 6px 18px rgba(31,214,85,.28)}
.btn.red{background:linear-gradient(#ff4a63,#d41231);color:#fff;box-shadow:0 6px 18px rgba(255,45,74,.3)}
.btn.violet{background:linear-gradient(#8f57ff,#5f23d6);color:#fff}
.btn.gold{background:linear-gradient(#ffd75a,#ffb21f);color:#2b1d00}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto}
h2{font-size:15px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12px;color:var(--muted);font-weight:400;text-decoration:none;cursor:pointer}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:grid;gap:6px;justify-items:center;font-size:12px}
.tile i{font-style:normal;font-size:22px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px) * 0);margin-top:6px}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{color:var(--accent)}
/* splash */
.splash{height:100%;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center}
.splash .logo{font-size:48px;flex-direction:column;gap:10px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:180px;height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}

.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--violet);background:radial-gradient(circle at 70% 20%,#3b1670,#150b24);padding:18px;min-height:190px;display:grid;align-content:end;gap:10px;box-shadow:0 0 30px rgba(123,60,255,.25)}
.hero svg{position:absolute;right:-6px;top:6px;width:62%;opacity:.95}
.hero .logo{font-size:34px}
.hero p{margin:0;font-weight:600;font-size:16px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gtile{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:10px 4px;display:grid;justify-items:center;gap:6px;font-size:12px;cursor:pointer}
.gtile .art{width:100%;height:58px;border-radius:10px;display:grid;place-items:center;font-size:28px}
.soon{font-size:10px;color:var(--gold)}

.stat{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.chip{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip.lo{color:#58b6ff}.chip.mid{color:#b184ff}.chip.hi{color:#ff5fa8}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0d0716;height:min(46vh,300px);min-height:220px}
.stage canvas{width:100%;height:100%;display:block}
.mult{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;font-family:var(--display);font-size:56px;font-variant-numeric:tabular-nums;text-shadow:0 4px 22px rgba(0,0,0,.6)}
.mult small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);text-shadow:none;margin-top:4px}
.mult.crash{color:var(--accent)}
.banner{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(18,60,30,.92);border:1px solid var(--good);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600}
.panel{margin-top:12px;display:grid;gap:10px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:grid;gap:6px}
.step label{font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:18px;flex:none}
.stepper input{width:100%;min-width:0;background:transparent;border:0;color:var(--fg);font:600 17px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px}
.quick button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 0;font-size:11px}
.live{display:grid;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}
.live div{display:flex;justify-content:space-between;gap:8px;background:var(--panel);border-radius:8px;padding:6px 10px}
.live .w{color:var(--good)}.live .l{color:var(--muted)}
.switch{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8a7ba6;transition:.15s}
.switch.on{background:var(--good);border-color:var(--good)}
.switch.on::after{left:22px;background:#fff}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(6,3,12,.82);display:grid;place-items:center;z-index:20;padding:20px;backdrop-filter:blur(3px)}
.result{width:100%;max-width:320px;text-align:center;display:grid;gap:12px;justify-items:center}
.result h3{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--gold)}
.result h3.lose{color:var(--accent)}
.result .amt{font-size:38px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.result .amt.lose{color:var(--accent)}
.sheet{width:100%;max-width:400px;max-height:80%;overflow:auto}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#16091f;font-weight:600;padding:9px 16px;border-radius:99px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center}
/* lists */
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.item .sp{flex:1;min-width:0}
.item i{font-style:normal;font-size:20px;width:26px;text-align:center}
.item small{display:block;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;font-weight:600}
.tabs button.on{background:var(--violet);border-color:var(--violet)}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.win{background:rgba(31,214,85,.18);color:var(--good)}
.pill.loss{background:rgba(255,45,74,.18);color:var(--accent)}
.pos{color:var(--good)}.neg{color:var(--accent)}
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.packs button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 0;font-weight:600}
.packs button.on{border-color:var(--gold);color:var(--gold)}
.field{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:600 17px var(--body)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--accent));display:grid;place-items:center;font-size:32px;margin:0 auto}
.faq p{margin:8px 0 0;color:var(--muted);line-height:1.5}
.note{font-size:12px;color:var(--muted);text-align:center;margin:14px 0}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.auth label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.auth label:first-child{margin-top:0}
.auth .btn{margin-top:16px}
.auth .field{font-weight:500;font-size:16px}
.err{color:var(--accent);font-size:13px;min-height:18px;margin-top:10px}
.pw{position:relative}
.pw .field{padding-right:68px}
.pwt{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12px;padding:10px}
.auth label.chk{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--fg);font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.btn.tg{background:linear-gradient(#37aee2,#1e88c8);color:#fff;display:block;text-align:center;text-decoration:none;margin-top:12px}
.pc-row{display:flex;gap:8px;margin-bottom:10px}
.pc-main{flex:1;min-width:0;border:2px solid var(--gold);background:linear-gradient(#3a2a05,#1f1530);color:var(--gold);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;text-align:left;animation:pcg 2s infinite}
.pc-main b{color:#fff}
.pc-auto{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px}
.pc-auto.on{background:var(--good);border-color:var(--good);color:#04230f}
@keyframes pcg{0%{box-shadow:0 0 0 0 rgba(255,201,60,.45)}70%{box-shadow:0 0 0 10px rgba(255,201,60,0)}100%{box-shadow:0 0 0 0 rgba(255,201,60,0)}}
.langsw{display:flex;justify-content:flex-end;gap:6px;padding-top:12px}
.langsw button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.langsw button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.lnk{background:none;border:0;color:var(--gold);font-size:13px;margin:12px auto 0;display:block;padding:6px}
.atabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.atabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.atabs button.on{background:var(--violet);border-color:var(--violet)}
.atabs button.hot{border:2px solid var(--gold);background:linear-gradient(#3a2a05,#1f1530);color:var(--gold);animation:pcg 2s infinite}
.atabs button.hot.on{background:linear-gradient(#5a4108,#2b1d44);color:#fff}
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.astat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.astat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.afld small{display:block;margin-top:4px;font-size:11px}
textarea.field{min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.arow .btn{flex:1;min-width:110px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  var g=0;while(nowMs>=TL.start+TL.plan.total*1000&&g++<20000){if(!TL.plan.dead){TL.hist.push(TL.plan.cp);if(TL.hist.length>14)TL.hist.shift()}tlSet(TL.day,TL.k+1,Math.round(TL.start+TL.plan.total*1000))}}
function syncFrom(d){if(!d||d.day!==TL.day||typeof d.k!=='number')return;var nowMs=Date.now();
  if(d.k===TL.k&&Math.abs(d.start-TL.start)<=150)return;
  var pl=planRound(d.k,d.start,d.day);if(nowMs>=d.start-200&&nowMs<d.start+pl.total*1000){tlSet(d.day,d.k,d.start)}}
function newRound(nowMs,now,e){var P=TL.plan;
  if(G.bet&&!G.bet.cashed&&!G.bet.settled&&G.k!==-1){record(G.cp,-G.bet.amt,false)}
  G.bet=null;G.roundBet=null;G.win=null;G.k=TL.k;G.day=TL.day;G.cp=P.cp;G.wt=P.wt;G.phase='wait';G.m=1;G.tw=now-(nowMs-TL.start);
  if(!G.rinit){G.rinit=1;G.recent=TL.hist.slice()}
  newBots();
  if(G.queued&&e<P.wt-.5){G.queued=false;if(S.bal>=G.amt&&G.amt>0){placeBet()}else toast('Not enough coins for queued bet')}
  G.online=Math.max(CFG.onlineBase*.75,G.online+Math.floor((Math.random()-.5)*400));
  if(OWNER&&DBH&&G.syncK!==TL.day+'|'+TL.k){G.syncK=TL.day+'|'+TL.k;try{DBH.doc('sync/main').set({day:TL.day,k:TL.k,start:TL.start,at:Date.now()}).catch(function(){})}catch(x){}}
  paintUi(true)}
function placeBet(){if(G.bet||G.amt<=0)return;if(S.bal<G.amt){toast('Not enough coins');return false}
  if(G.amt<CFG.minBet){toast('Minimum bet is '+fmt(CFG.minBet));return false}
  if(G.amt>CFG.maxBet){toast('Maximum bet is '+fmt(CFG.maxBet));return false}
  if(!SRV.ready){toast('Connecting… try again in a moment');return false}
  var amt=G.amt,au=G.autoOn&&G.auto>=1.01?G.auto:0;
  S.bal-=amt;var mine=G.bet={amt:amt,cashed:false,pend:1};G.roundBet=mine;SRV.lastAuto=au;updBal();beep(520,.08,'triangle');
  SRV.call('bet',{amount:amt,auto:au}).then(function(r){mine.pend=0;applyMe(r.me)},function(e){if(G.bet===mine){G.bet=null;G.roundBet=null}toast(e.m||'Bet failed');SRV.resync();paintUi(true)});
  return true}
function cancelBet(){if(G.bet&&G.phase==='wait'){var b=G.bet;S.bal+=b.amt;G.bet=null;G.roundBet=null;updBal();SRV.call('cancel').then(function(r){applyMe(r.me)},function(e){toast(e.m||'Could not cancel');SRV.resync()})}}
function record(){}
function cashOut(){if(!G.bet||G.bet.cashed||G.bet.wait||G.phase!=='fly')return;var mine=G.bet;mine.wait=1;SRV.call('cash').then(function(){mine.wait=0},function(e){mine.wait=0;if(e.m)toast(e.m)})}
function loop(now){
  var R=SRV.round;
  if(R){var sn=srvNow();
    if(G.phase==='wait'&&sn>=R.flyAt){G.phase='fly';beep(300,.1,'sawtooth',.03)}
    if(G.phase==='fly'&&SRV.ready){var el=Math.max(0,(sn-R.flyAt)/1000);G.t0=now-el*1000;G.m=Math.max(1,Math.exp((G.spd||CFG.speed)*el));
      G.bots.forEach(function(b){if(!b.done&&G.m>=b.tg)b.done=true})}}
  if(cur==='game'){draw(now);if(now-G.lastUi>120){G.lastUi=now;paintUi()}}
  requestAnimationFrame(loop)}
G.k=-1;G.recent=[];requestAnimationFrame(loop);

var lastSig='';

function draw(now){
  var cv=$('#cv');if(!cv)return;var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);var W=r.width,H=r.height;c.clearRect(0,0,W,H);
  var acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ff2d4a';
  // rays
  c.save();c.translate(0,H);for(var i=0;i<16;i++){c.rotate(-Math.PI/2/16);c.fillStyle=i%2?'rgba(255,255,255,.018)':'rgba(255,255,255,0)';c.beginPath();c.moveTo(0,0);c.lineTo(W*2,-6);c.lineTo(W*2,6);c.fill()}c.restore();
  var t=G.phase==='wait'?0:G.phase==='fly'?(now-G.t0)/1000:Math.log(G.cp)/(G.spd||CFG.speed);
  var tmax=Math.max(7,t*1.12),mmax=Math.max(2,G.m*1.18),px=14,py=22;
  function X(tt){return px+(tt/tmax)*(W-px*2-40)}
  function Y(mm){return H-py-((mm-1)/(mmax-1))*(H-py*2-20)}
  var pts=[];for(var k=0;k<=70;k++){var tt=t*k/70;pts.push([X(tt),Y(Math.exp((G.spd||CFG.speed)*tt))])}
  var ex=pts[pts.length-1][0],ey=pts[pts.length-1][1];
  if(t>0){c.beginPath();c.moveTo(pts[0][0],H);pts.forEach(function(p){c.lineTo(p[0],p[1])});c.lineTo(ex,H);c.closePath();var g=c.createLinearGradient(0,ey,0,H);g.addColorStop(0,acc+'88');g.addColorStop(1,acc+'05');c.fillStyle=g;c.fill();
    c.beginPath();pts.forEach(function(p,i){i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])});c.strokeStyle=acc;c.lineWidth=3.5;c.lineJoin='round';c.stroke()}
  var ang=-.28;if(pts.length>4){var a=pts[pts.length-5],b=pts[pts.length-1];ang=Math.atan2(b[1]-a[1],b[0]-a[0])}
  var ox=0,oy=0;if(G.phase==='crash'){var dt=(now-G.tc)/1000;ox=dt*dt*420+dt*120;oy=-dt*dt*160}
  if(G.phase==='crash'&&ox>W)return;
  c.save();c.translate(ex+ox,ey+oy);c.rotate(ang);var s=.55;c.scale(s,s);
  c.fillStyle='#ff2d4a';c.beginPath();c.moveTo(34,0);c.lineTo(12,-7);c.lineTo(-26,-6);c.lineTo(-34,0);c.lineTo(-26,6);c.lineTo(12,7);c.closePath();c.fill();
  c.fillStyle='#ff6a80';c.beginPath();c.moveTo(10,-4);c.lineTo(-10,-34);c.lineTo(-18,-34);c.lineTo(-8,-4);c.fill();
  c.fillStyle='#b00d27';c.beginPath();c.moveTo(10,4);c.lineTo(-10,34);c.lineTo(-18,34);c.lineTo(-8,4);c.fill();
  c.fillStyle='#ff6a80';c.beginPath();c.moveTo(-26,-3);c.lineTo(-38,-16);c.lineTo(-31,-16);c.lineTo(-18,-3);c.fill();
  c.fillStyle='#ffd7dd';c.beginPath();c.ellipse(18,-1,8,3.2,0,0,7);c.fill();
  if(G.phase==='fly'){c.fillStyle='rgba(255,160,60,.8)';c.beginPath();c.moveTo(-34,0);c.lineTo(-52-Math.random()*10,0);c.lineTo(-34,3);c.fill()}
  c.restore();
}

function pickHtml(id){

  '<label for="'+id+'_u" style="margin-top:8px">Or paste an image link</label><div style="display:flex;gap:8px"><input class="field" id="'+id+'_u" inputmode="url" placeholder="https://…/photo.jpg" style="flex:1"><button type="button" class="btn ghost sm" id="'+id+'_ub" style="margin:0;flex:none;min-width:0">Use link</button></div>'+
  '<label for="'+id+'_p" style="margin-top:8px">Or paste a copied image</label><div class="field" id="'+id+'_p" contenteditable="true" role="textbox" aria-label="Paste image here" style="min-height:44px;color:var(--muted,#9aa)" data-ph="Long-press here, then tap Paste">Long-press here, then tap Paste</div>'+
  '<div class="muted" id="'+id+'_s" role="status" style="min-height:18px;margin-top:6px"></div></div>'}
function pickBind(id,maxLen,onOk){
  function st(t){var e=$('#'+id+'_s');if(e)e.textContent=t||''}
  function fail(m){st(m);toast(m)}
  function ok(u){st('');onOk(u)}
  function file(f){if(!f)return;st('Reading image…');readImg(f,maxLen,ok,fail)}
  var opened=false,hintT=null;
  function seen(){opened=true}
  window.addEventListener('blur',seen);document.addEventListener('visibilitychange',seen);
  ['_f','_c'].forEach(function(x){var e=$('#'+id+x);if(!e)return;
    e.onclick=function(){opened=false;clearTimeout(hintT);hintT=setTimeout(function(){if(!opened&&$('#'+id+x))fail('Gallery or camera did not open here. Open this page in Chrome, or use the paste or link option below.')},1500)};
    e.onchange=function(){opened=true;clearTimeout(hintT);file(this.files&&this.files[0]);this.value=''}});
  $('#'+id+'_ub').onclick=function(){var u=($('#'+id+'_u').value||'').trim();if(!/^https?:\/\//i.test(u)){fail('Paste a link that starts with http');return}
    st('Loading image…');
    fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){readImg(b,maxLen,ok,fail)}).catch(function(){
      var im=new Image();im.onload=function(){if(u.length<maxLen)ok(u);else fail('Link is too long.')};im.onerror=function(){fail('This link did not load. Try another image link.')};im.src=u})};
  var pb=$('#'+id+'_p'),ph=pb.dataset.ph;
  pb.onfocus=function(){if(pb.textContent===ph)pb.textContent=''};
  pb.onblur=function(){if(!pb.textContent.trim())pb.textContent=ph};
  pb.onpaste=function(e){var cd=e.clipboardData,items=cd&&cd.items||[];for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image/')===0){e.preventDefault();file(items[i].getAsFile());pb.textContent=ph;return}}
    var t=cd&&cd.getData('text');if(t&&/^https?:\/\//i.test(t.trim())){e.preventDefault();$('#'+id+'_u').value=t.trim();pb.textContent=ph;$('#'+id+'_ub').click()}};
  pb.oninput=function(){if(pb.textContent!==ph&&!/^https?:/i.test(pb.textContent.trim()))pb.textContent=ph}}
function readImg(f,maxLen,ok,fail){
  function fin(src,w,h){var m=560,q=.75,url='';
    for(var k=0;k<6;k++){var sc=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<maxLen)break;m=Math.round(m*.8);q=Math.max(.45,q-.08)}
    if(url.length>=maxLen)fail('Image is too large. Choose a smaller one.');else ok(url)}
  function viaImg(){var rd=new FileReader();rd.onerror=function(){fail('This image could not be read.')};
    rd.onload=function(){var im=new Image();im.onerror=function(){fail('This image format is not supported. Choose a JPG or PNG.')};im.onload=function(){fin(im,im.naturalWidth||im.width,im.naturalHeight||im.height)};im.src=rd.result};rd.readAsDataURL(f)}
  try{if(window.createImageBitmap){createImageBitmap(f).then(function(bm){fin(bm,bm.width,bm.height)},viaImg)}else viaImg()}catch(e){viaImg()}}

var hasOwn=Object.prototype.hasOwnProperty;
function trText(s){
  var m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s),core=m[2];if(!core)return s;var r;
  if(hasOwn.call(HI,core))r=HI[core];
  else{r=core;for(var i=0;i<HIRE.length;i++)r=r.replace(HIRE[i][0],HIRE[i][1]);if(r===core)return s}
  return m[1]+r+m[3];
}
function trAttrs(el){['placeholder','aria-label','title'].forEach(function(a){var v=el.getAttribute&&el.getAttribute(a);if(v){var r=trText(v);if(r!==v)el.setAttribute(a,r)}})}
function trNode(n){
  if(n.nodeType===3){var v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1)return;
  trAttrs(n);
  var w=document.createTreeWalker(n,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,null),x;
  while((x=w.nextNode())){
    if(x.nodeType===3){var t=trText(x.nodeValue);if(t!==x.nodeValue)x.nodeValue=t}else trAttrs(x)}
}

});
